[package]
name = "terrafabric"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "tfab: agent-first command line for TerraFabric, the agentic geospatial intelligence market (discovery, pricing, orders, C2 tasking and OSINT), with a self-describing ontology and an MCP server"
authors = ["NERVOSYS <terrafabric@nervosys.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nervosys/TerraFabricCLI"
homepage = "https://terrafabric.world"
readme = "README.md"
keywords = ["earth-observation", "geospatial", "cli", "mcp", "agents"]
categories = ["command-line-utilities", "science::geo"]
# Only what the crate needs; nothing else in the directory can be published.
include = ["src/**/*.rs", "ontology/tools.json", "ontology/cli.ttl", "ontology/cli-shapes.ttl", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "tfab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["string", "env", "wrap_help"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
oxttl = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
